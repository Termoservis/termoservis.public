<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Stranica je privremeno nedostupna." />
    <title>Stranica je privremeno nedostupna</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: #f5f6f8;
        color: #202938;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      main {
        width: 100%;
        max-width: 34rem;
      }

      .status {
        display: inline-block;
        margin: 0 0 1.5rem;
        padding: 0.5rem 0.875rem;
        border: 1px solid #d6dbe3;
        border-radius: 999px;
        color: #526074;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3rem);
        font-weight: 650;
        line-height: 1.15;
        letter-spacing: -0.035em;
        overflow-wrap: break-word;
      }

      .message {
        margin: 1.25rem 0 0;
        color: #526074;
        font-size: 1rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">Privremeno offline</p>
      <h1>Stranica je privremeno nedostupna.</h1>
      <p class="message">Molimo pokušajte ponovno kasnije.<br />Hvala na razumijevanju.</p>
    </main>
  </body>
</html>
